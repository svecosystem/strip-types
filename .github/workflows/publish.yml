name: Publish

on:
    push:
        branches:
            - main

permissions: {}
jobs:
    release:
        # prevents this action from running on forks
        if: github.repository == 'svecosystem/strip-types'
        permissions:
            contents: write # to create release (changesets/action)
            id-token: write # OpenID Connect token needed for provenance
            pull-requests: write # to create pull request (changesets/action)
        name: Build & Publish Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  # fetch all history so changesets can generate changelogs with the correct commits
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  commit-message: "chore(release): version package"
                  pr-title: "chore(release): version package"
                  publish-script: "pnpm ci:release"
                  version-script: "pnpm changeset-version"
              env:
                  NPM_CONFIG_PROVENANCE: true
